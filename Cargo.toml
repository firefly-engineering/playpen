[package]
name = "playpen"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/firefly-engineering/playpen"
description = "Confine an agent's process tree to a declared boundary"
publish = false

[dependencies]
# The maintained fork, pinned by exact `rev` and never a branch or range (ADR 0022).
# A bump is a PR that stays red until the enforcement suite passes.
nono = { git = "https://github.com/firefly-engineering/nono", rev = "e5ff57f916b528c38ee00d20556d86902215e3d8", default-features = false }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"

[dev-dependencies]
tempfile = "3"
toml = "0.9"
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
