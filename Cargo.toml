[package]
name = "playpen"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/firefly-engineering/playpen"
description = "Confine an agent's process tree to a declared boundary"
publish = false

[dependencies]
# The maintained fork, pinned by exact `rev` and never a branch or range (ADR 0022).
# A bump is a PR that stays red until the enforcement suite passes.
nono = { git = "https://github.com/firefly-engineering/nono", rev = "5ee60f6fcebc1a006865d8f9a62e235a0f0ce1ed", default-features = false }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# The policy's JSON Schema is generated from its serde types, never written beside them.
schemars = "1"
serde = { version = "1", features = ["derive"] }
# Exact: the policy parser reads the kind of an error raised through an alias back from its message
# (src/policy/syntax.rs), so a bump is a reviewed change whose tests show the wording held, until
# serde-saphyr keeps the inner error (https://github.com/firefly-engineering/playpen/issues/125).
serde-saphyr = "=1.3.0"
serde_json = "1"
# A minter's stdout is a secret channel: what comes off it is held in `Zeroizing` from the moment
# it is read (spec §7.2).
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# The broker's own stack ([spec §6.2]). The proxy is the supervisor's, in-process, one thread per
# connection: no async runtime, because nothing here needs to hold ten thousand sockets.
#
# `rustls` both terminates TLS for a routed host and speaks it upstream, and `rcgen` mints the
# ephemeral session CA and its leaves. Both are built on `aws-lc-rs`, so one crypto provider
# serves the whole proxy rather than two that could disagree.
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# Upstream verification is the host's own trust store: playpen intercepts the agent's TLS and must
# not weaken its own.
rustls-native-certs = "0.8"
# A real incremental HTTP/1.1 parser. The proxy reads a request head to find the header the phantom
# came in; a pattern over bytes would be a parser with corner cases instead of a parser.
httparse = "1"
# The session phantom is random bytes and nothing more, so the smallest thing that gives them.
getrandom = "0.3"

# The probe's Mach lookups, and the bootstrap codes that tell a denial from an unknown service.
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"

# What each Landlock ABI offers, read from the crate nono is built against, at the exact version
# nono resolves: the two move together or not at all (tests/pin.rs).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"

[dev-dependencies]
tempfile = "3"
toml = "0.9"

# The floor self-test forks, which is sound only in a single-threaded process, so this suite
# runs outside the libtest harness.
[[test]]
name = "floor_self_test"
harness = false

# Re-runs itself as each job, so the signals a supervisor holds for its whole life are never the
# test's own: a harness of its own, since libtest would not hand over `main`.
[[test]]
name = "pre_exec"
harness = false

# The enforcement suite (spec §17). Its `P-canary` row is the floor self-test, so it too runs
# outside the libtest harness.
[[test]]
name = "enforcement"
path = "tests/enforcement/main.rs"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
