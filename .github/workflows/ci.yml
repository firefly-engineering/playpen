name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Pinned runner labels, never `-latest` (spec §17.1).
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Formatter
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test --locked

  # The dev shell takes its Rust version from rust-toolchain.toml; evaluating it on every system
  # fails if toolbox does not ship that version, so the two can never drift apart unnoticed.
  flake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate the dev shell
        run: |
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            nix eval --raw ".#devShells.$system.default.drvPath"
            echo
          done
